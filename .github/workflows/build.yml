name: Build and test

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Compile and run tests
        run: bash build.sh
      - name: Run analyzer on sample logs
        run: java -cp out seclog.Main --year 2026 samples/auth.log samples/ufw.log
